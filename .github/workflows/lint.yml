name: Code Quality

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: |
          echo "Checking JavaScript files for syntax errors..."
          find api public -name "*.js" -type f -exec node -c {} \;

      - name: Verify project structure
        run: |
          echo "Verifying project structure..."

          # Check required directories exist
          test -d api/_lib/providers || exit 1
          test -d api/_lib/utils || exit 1
          test -d api/subtitles/movie || exit 1
          test -d api/subtitles/series || exit 1
          test -d api/subtitles/merged || exit 1
          test -d public || exit 1

          # Check required files exist
          test -f package.json || exit 1
          test -f vercel.json || exit 1
          test -f README.md || exit 1

          echo "✓ All required files and directories present"

      - name: Verify package.json
        run: |
          echo "Verifying package.json..."
          node --input-type=module -e "
            import { readFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('./package.json', 'utf8'));
            if (!pkg.dependencies['stremio-addon-sdk']) {
              throw new Error('Missing stremio-addon-sdk dependency');
            }
          "
          echo "✓ package.json is valid"

      - name: Code quality summary
        if: always()
        run: |
          echo "### ✅ Code Quality Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Syntax check: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Structure verification: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Package validation: Passed" >> $GITHUB_STEP_SUMMARY
